# nginx in front of the exported static site.
#
# Next.js `output: "export"` writes each route as `<route>.html` plus a
# `<route>/` directory (and a root 404.html), so a plain `index` lookup 404s on
# every client route: the try_files line below is what makes them work.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static export: try the exact path, then the same path with .html, then a
    # directory index.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Hashed build output never changes under a given name.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
