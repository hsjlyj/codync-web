# Local run of both images.
#
#   docker compose up --build          # build from this checkout
#   CODYNC_IMAGE_NAMESPACE=<you> docker compose up   # use the published images
#
# The published layout is the same: <namespace>/codync-host, <namespace>/codync-web.
#
# After the containers are up, pair a client from inside the host container —
# a container has no desktop app, so approving a device is the CLI:
#
#   docker compose exec host codync-host access list
#   docker compose exec host codync-host access approve <requestId>

services:
  host:
    build:
      context: .
      dockerfile: host/Dockerfile
    image: ${CODYNC_IMAGE_NAMESPACE:-codync}/codync-host:${CODYNC_IMAGE_TAG:-local}
    container_name: codync-host
    restart: unless-stopped
    ports:
      # Loopback on purpose. The host's pairing endpoint (/channel) authenticates
      # by handshake rather than a bearer token, and /health is an open network
      # fingerprint: publishing 19222 on 0.0.0.0 hands both to everyone on the
      # LAN. Keep the default local, where the Web client on this machine uses
      # http://127.0.0.1:19222.
      #
      # A phone on the same LAN or on Tailscale needs the port published on the
      # host's own address AND that address announced — the container's address
      # (172.x.x.x) is useless to a phone:
      #
      #   ports: ["0.0.0.0:19222:19222"]
      #   environment: ["CODYNC_EXTERNAL_URL=http://<host-lan-ip>:19222"]
      #
      # Never point CODYNC_EXTERNAL_URL at 127.0.0.1: the value travels to the
      # device, where 127.0.0.1 means the device itself.
      - "127.0.0.1:19222:19222"
    volumes:
      - codync-data:/home/codync/.codync

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ${CODYNC_IMAGE_NAMESPACE:-codync}/codync-web:${CODYNC_IMAGE_TAG:-local}
    container_name: codync-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - host

volumes:
  codync-data:
