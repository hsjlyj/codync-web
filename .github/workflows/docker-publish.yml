name: docker images

# Builds both images, smoke-tests them, and publishes them to the GitHub
# Container Registry on every run:
#
#   ghcr.io/<owner>/codync-host
#   ghcr.io/<owner>/codync-web
#
# GHCR needs no credentials at all: the run authenticates with the built-in
# GITHUB_TOKEN under the `packages: write` permission declared below, so this is
# the path that produces a publicly verifiable manifest without asking the user
# for anything. A package's visibility follows its repository's: this repository
# is public, and both packages were verified answering anonymous pulls with
# HTTP 200 (2026-11-05). A private repository would produce private packages,
# switchable under the package's own settings.
#
# Docker Hub is published in addition to GHCR when both repository secrets are
# present:
#   DOCKERHUB_USERNAME  the account or organization
#   DOCKERHUB_TOKEN     an access token with Read & Write
#
# Tags: `latest` is produced only for v* tags; every run additionally tags the
# short commit sha, so each build stays individually referenceable.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Publish the images (GHCR always; Docker Hub too when its secrets exist)"
        type: boolean
        default: true
  push:
    branches:
      - ci/docker-images
      - 'verify/**'
      # The repository's default branch goes here so that a merge also produces
      # a sha-<7> tag that can be quoted long after the ci/ branch is gone. A
      # branch filter cannot read the default branch at runtime, so this name
      # has to be kept in sync if the default branch is ever renamed.
      - feat/web-client
    tags:
      - "v*"

concurrency:
  group: docker-images-${{ github.ref }}
  # A tag run must never be cancelled by whatever is pushed next: cancelling one
  # mid-flight leaves half a release behind — the web image already in the
  # registry and the host image never pushed, which is exactly what run
  # 41959391015 left. Branch runs keep the old behaviour.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: host
            dockerfile: host/Dockerfile
            repository: codync-host
          - name: web
            dockerfile: web/Dockerfile
            repository: codync-web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Decide where this run publishes
        id: mode
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        run: |
          set -euo pipefail
          # GHCR rejects an uppercase owner.
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          publish=false
          hub=false
          images="local/${{ matrix.repository }}"
          if [ "$REQUESTED" = "true" ]; then
            publish=true
            images="ghcr.io/$owner/${{ matrix.repository }}"
            if [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
              hub=true
              images="$images"$'\n'"$HUB_USER/${{ matrix.repository }}"
            else
              echo "::notice::Docker Hub secrets are absent — publishing to GHCR only."
            fi
          else
            echo "::warning::Publishing was turned off for this run — building and smoke-testing locally."
          fi
          {
            echo "publish=$publish"
            echo "hub=$hub"
            echo "images<<IMAGES_EOF"
            echo "$images"
            echo "IMAGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.mode.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.mode.outputs.hub == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.mode.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # load is what makes the image available to the smoke tests below; it
      # works together with push for a single-platform build. Adding a second
      # platform would mean pulling the pushed tag instead of loading it.
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.mode.outputs.publish == 'true' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Pulling back what was just pushed is the only check that the manifest
      # really landed in a registry other people can read, rather than merely
      # being accepted by the daemon that built it.
      - name: Pull the pushed tags back from the registries
        if: steps.mode.outputs.publish == 'true'
        run: |
          set -euo pipefail
          tag="$(echo "${{ steps.meta.outputs.tags }}" | grep -m1 '^ghcr\.io/')"
          docker pull "$tag"
          echo "pulled $tag"
          if [ "${{ steps.mode.outputs.hub }}" = "true" ]; then
            tag="$(echo "${{ steps.meta.outputs.tags }}" | grep -vm1 '^ghcr\.io/')"
            docker pull "$tag"
            echo "pulled $tag"
          fi

      # The architecture recorded in the registry is what the docs have to
      # quote, so put it in the log instead of leaving it to be inferred.
      - name: Report the published manifest
        if: steps.mode.outputs.publish == 'true'
        run: |
          set -euo pipefail
          tag="$(echo "${{ steps.meta.outputs.tags }}" | grep -m1 '^ghcr\.io/')"
          docker buildx imagetools inspect "$tag"

      - name: Smoke test (host)
        if: matrix.name == 'host'
        run: |
          set -euo pipefail
          image="$(echo "${{ steps.meta.outputs.tags }}" | head -1)"
          echo "image: $image"

          # The binary starts and reports its version: catches a broken link.
          docker run --rm "$image" --version

          # CODYNC_CLOUD=off stops the smoke test from registering a throwaway
          # computer with the production cloud on every CI run
          # (remote/cloud_url.rs:57; the log line is `registered with the Codync
          # cloud`). A named volume is used from the first run because surviving
          # the loss of the container is exactly what docker-compose.yml
          # promises for codync-data.
          start() {
            docker run -d -p 19222:19222 -e CODYNC_CLOUD=off \
              -v codync-smoke:/home/codync/.codync "$image"
          }
          wait_ready() {
            # Readiness, not connectivity: the kernel accepts the TCP connection
            # into the backlog long before axum::serve answers (the bind is at
            # main.rs:512, serving starts at :537, with the token, the store and
            # network::start in between). Poll /health for a real HTTP 200, and
            # cap each request so a half-open socket cannot hang the loop.
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 3 -o /dev/null http://127.0.0.1:19222/health; then return 0; fi
              sleep 1
            done
            echo "::error::the daemon never answered /health with 200"
            return 1
          }

          container="$(start)"
          trap 'docker rm -f "$container"' EXIT
          wait_ready
          docker logs "$container" | tail -30
          [ "$(docker inspect -f '{{.State.Running}}' "$container")" = "true" ]

          # Gate 1 — the listening port is compiled in (Environment::port()),
          # so the startup line is where a Dev build shows up as 19223.
          # Never set RUST_LOG here: a valid narrower filter replaces the
          # default `codync_host=info`, drops this line, and leaves a gate that
          # can never light up.
          docker logs "$container" 2>&1 | grep -q "codync-host listening"

          # Gate 2 — /health is the one runtime surface of the compile-time
          # CODYNC_ENV, and it needs no token. A Dev build would answer "dev".
          health="$(curl -fsS http://127.0.0.1:19222/health)"
          echo "GET /health -> $health"
          echo "$health" | grep -qiE '"environment"[[:space:]]*:[[:space:]]*"main"'

          # Boundary A — the named volume has to outlive the container.
          host_id="$(echo "$health" | sed -n 's/.*"hostId":"\([^"]*\)".*/\1/p')"
          if [ -z "$host_id" ]; then
            echo "::error::no hostId in the /health payload"
            exit 1
          fi
          docker rm -f "$container"
          container="$(start)"
          wait_ready
          again="$(curl -fsS http://127.0.0.1:19222/health | sed -n 's/.*"hostId":"\([^"]*\)".*/\1/p')"
          echo "hostId after rebuilding the container -> $again (was $host_id)"
          [ "$again" = "$host_id" ]

          # Boundary B — publishing 19222 must not hand the host API to the
          # network: /health is open by design, while /api/{method} is loopback
          # plus a token (api/http.rs:64,139). Behind the published port the
          # peer is the bridge gateway rather than 127.0.0.1, so a request that
          # carries the real token still has to be refused. The token is read
          # from the daemon and never echoed.
          #
          # The method has to be the real one: the router rejects a wrong method
          # with 405 before the token is ever looked at, so a GET here proves
          # nothing about the boundary (it did exactly that on run 41959217682).
          # /api/hello exists (host.rs:58) and takes no body — the token is
          # checked before the body is read (http.rs:131-141).
          #
          # Passing this gate is what proves the peer is not loopback. A 200
          # here would be a real finding — the published port handing the host
          # API to anyone who connects — and must never be "fixed" by relaxing
          # the assertion.
          # Control first — the 401 below only means something if a valid token
          # really is accepted on the loopback path. Every other step in this job
          # reads state straight off disk, so nothing here had ever proved that
          # token works: the previous version of this gate was answered 405
          # before the token was read at all (run 41959217682) and would still
          # have "passed" as a boundary test. `devices list` goes through
          # local_call — loopback plus the same token check the API uses
          # (main.rs:356) — and its output is dropped so no device list lands in
          # the log.
          docker exec "$container" codync-host devices list > /dev/null

          token="$(docker exec "$container" codync-host info --json \
            | tr -d ' \n' | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          if [ -z "$token" ]; then
            echo "::error::could not read a token from the running daemon"
            exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" http://127.0.0.1:19222/api/hello)"
          echo "POST /api/hello from outside the container, with the real token -> $code"
          [ "$code" = "401" ]

          echo "host image serves 19222 as a main build"

      - name: Smoke test (web)
        if: matrix.name == 'web'
        run: |
          set -euo pipefail
          image="$(echo "${{ steps.meta.outputs.tags }}" | head -1)"
          echo "image: $image"

          docker run --rm "$image" nginx -t

          container="$(docker run -d -p 8080:80 "$image")"
          trap 'docker rm -f "$container"' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null http://localhost:8080/; then break; fi
            sleep 1
          done
          # The exported routes are files, not directories: this is what proves
          # web/nginx.conf got the try_files rule right.
          curl -fsS -o /dev/null -w "GET /        -> %{http_code}\n" http://localhost:8080/
          curl -fsS -o /dev/null -w "GET /client  -> %{http_code}\n" http://localhost:8080/client
          # A nested route the export really contains, on top of /client.
          curl -fsS -o /dev/null -w "GET /client/chat -> %{http_code}\n" http://localhost:8080/client/chat

          # Negative case: the catch-all must not turn a typo into a 200 index
          # page, which would make every missing route look like a working one.
          missing="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/no-such-route)"
          echo "GET /no-such-route -> $missing"
          [ "$missing" = "404" ]
